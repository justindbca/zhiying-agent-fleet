name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install redis-server and tmux
        run: brew install redis tmux
      - name: Install package
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Run tests
        run: python -m pytest -q tests

  # Linux is the other supported host (incl. Windows via WSL2, design §0 / §8). Same suite, same
  # tests: a test that cannot run here is skipped in the test itself (skipif + reason), never
  # weakened or deleted for CI. WezTerm is not installed: the real mux server integration tests
  # (design §7.3) skip themselves when `wezterm-mux-server` is absent, like the real-Redis tests.
  pytest-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install redis-server, tmux, and the helpers the suite shells out to
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server tmux procps passwd coreutils
      - name: Install package
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Show tool versions
        run: |
          redis-server --version
          tmux -V
          node --version
          python --version
          which systemd-inhibit || echo 'systemd-inhibit: absent (keep_awake_prefix returns [])'
      - name: Run tests
        run: python -m pytest -q tests
