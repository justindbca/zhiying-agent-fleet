  - {supervisor_cli: pi, worker_cli: claude, mode: task, status: verified, adapter_missing: [],
     verified_by: "real smoke scripts/smoke_pair.sh pi claude task: fleet-20261013-115145-828661b9 2026-10-13 @3421f0d8+feat/codex-via-pi worktree, 4/4 checks PASS",
     reason: "transport v2 pi supervisor + official Claude Code workers: verified by a real smoke (scripts/smoke_pair.sh pi claude task, see verified_by); shown only if this row is set back to unverified",
     notes: "default (user decision 2026-10-13): pi Astra/high supervisor + official Claude Code workers"}
