# accounts: a budget card's "pool" names an account by id or alias; meter picks the budget line:
#   usd_equiv -> max_usd (equivalent USD since the card started; caps.day_usd / night_usd is the default
#                cap when the card has none, else 40 / 10), week_pct -> max_week_pct (absolute weekly %),
#   calls / none -> no pool line. Readings come from quota.json (rows keyed by account id).
# Example for the private file:
#   accounts:
#     - {id: pool-a, provider: claude, aliases: [], meter: usd_equiv, hosts: [host-1], caps: {day_usd: 40, night_usd: 10}}
#     - {id: pool-b, provider: claude, meter: week_pct, hosts: [host-2]}
#     - {id: codex-a, provider: codex, meter: week_pct}
accounts: []

# tools: tool pools (Tavily keys, X accounts, ...) behind thin MCP servers; filled in the private file.
tools: {}

pi_context:
  # Context window of pi models in every run (user 2026-10-27: default 400K, with a place to change it).
  # start writes <run>/pi-home/models.json as a copy of the source models.json with these applied
  # (no block, or neither key set: the source file is linked as before).
  #   default_window: custom models (providers.*.models[]) that set no contextWindow get this value.
  #                   Models that set their own window keep it (e.g. a local model capped by memory).
  #   per_model:      "<provider>/<model id>" -> window, set even when the model has its own value;
  #                   a built-in model (not in the source file) goes to providers.<p>.modelOverrides.
  # The fleet's handoff thresholds read the window pi reports, so fleet and pi always agree.
  # Override the whole block in the private file (~/.cmux-fleet/fleet.yaml).
  default_window: 400000
  per_model: {}

daemon_watch:
  # The supervisor's daemon watchdog (docs/design.md §36; pi supervisor: fleet's pi extension). Every
  # check_interval_s it asks its bridge for fx:daemon:beat. Older than stale_after_s, no daemon holding the run's
  # lock and the run unfinished -> one supervisor turn with the log facts; the supervisor runs the restart command
  # its AGENTS.md names. No second turn within realert_after_s. Read when a supervisor generation starts.
  # Override the whole block in the private file (~/.cmux-fleet/fleet.yaml); seconds > 0.
  check_interval_s: 120
  stale_after_s: 120
  realert_after_s: 600
