lifecycle_modes:
  # Lifecycle modes (docs/design.md).
  # A lifecycle decides what "done" means and how a run is closed after done / blocked / timeout.
  # `start --lifecycle <mode>` is required; `base` maps it onto the transport mode (cfg['mode']:
  # task | service). The daemon re-reads this file when its mtime changes (no restart needed).
  version: 1
  require_mode_on_start: true          # start without --lifecycle -> refused
  common:
    on_blocked: {hold_hours: 12, then: stop_keep_resumable, notify: [tg, parent]}
    on_budget_exhausted: {hold_hours: 12, then: stop_keep_resumable, notify: [tg, parent]}
    close_workspace_after_stop: true
    notify_parent_session: true
  modes:
    service:
      base: service
      on_complete: never
      worker_idle_reclaim_min: 30
      idle_stop_hours: null            # null = never stops by itself
      stop: user_only
      clock_gate: false
    dev_task:
      base: task
      done_when: merged_to_deploy_branch_and_enqueued
      require_integrator_worker: true
      # master design v2 §4.14 (draft said fable). Review rounds are capped (10/13 codex-notype ran to r16):
      # a FAIL verdict at round max_rounds stops the rounds; the open P0/P1 go to the user in the result
      # (outstanding.json / .md), no new round. Reviewers in a fleet follow cmux_fleet/agents/reviewer.md.
      review_step: {reviewer: opus, must_pass: true, max_rounds: 3, on_cap: stop_and_report}
      on_complete: stop_and_close
      notify: [tg, parent]
    program:
      base: task                       # each phase runs as a child dev_task fleet
      resident: false
      child_mode: dev_task
      ledger: program_ledger.json
      done_when: last_phase_merged_and_review_pass
    scheduled:
      base: task
      hard_timeout_min: 150            # sector rotation: 150-minute budget, task dispatched within 90 min
      on_complete: stop_and_close
      on_fail: stop_and_close
      clock_gate: true                 # trading-day gate via global_clock; market closed -> not launched
      clock_market: US
    review_loop:
      base: task
      max_rounds: 3
      on_pass: stop_and_close
      on_cap: stop_and_report
    smoke:
      base: task
      bases: [task, service]           # pair acceptance (A cli_pairs): `--mode service` smokes a service pair
      on_any_end: stop_and_close

walls:
  # Wall table (one table for the whole fleet; brake.py reads it, the watchdog only "sees").
  # Absorbs the operator's cli_tier_map.yaml (same_cli_downgrade / aliases / default) and
  # the wall regexes of OpenClaw multi_agent_daemon.py (_RATE_LIMIT_PATTERNS, _MODEL_POOL_WALL_PATTERNS).
  # MAD keeps its own copy: change the CLI wall wording in both together (generic patterns: see below).
  #
  # account   : the whole account / CLI is walled (weekly / session / usage limit). Changing the
  #             model does not help -> switch side (other CLI) or stop. Inside one fleet the brake pauses
  #             (stop, keep resumable); switching side is the CLI pairs table's job (item A).
  # model_pool: only one model tier is walled ("You've reached your Fable limit"). Same CLI one tier
  #             down usually still has quota -> same_cli_downgrade.
  # Only the CLIs' own wall wording (Claude / Codex) belongs here. Generic "rate limited" / "429 Too Many
  # Requests" / "quota exceeded" are NOT walls: third-party tools (Tavily, reddit, WebFetch) print them, and a
  # worker report pasted into the supervisor pane puts them on that screen (EF review r1 P1-01). MAD keeps
  # them because it only judges `-p` text; the two tables differ on purpose here.
  # Account patterns are checked first: a weekly-limit screen that also says /usage-credits is account-level.
  # Auth errors (401, Not logged in, expired OAuth) are not walls: the watchdog handles them.
  account:
    - "You've (?:hit|reached) your (?:usage|weekly|session|daily|monthly|5-hour) limit"
    - "\\b(?:weekly|session|daily|5-hour|usage) limit reached"
    - "Claude (?:AI )?usage limit reached"
  model_pool:
    - "You've (?:hit|reached) your\\s+(?!(?:usage|weekly|session|daily|monthly|5-hour)\\b)[\\w.\\-]+.{0,20}?\\blimit\\b"
    - "/usage-credits"
    - "Set up usage credits"
  # Same CLI one tier down (2026-09-20). Codex gpt-5.6-* names are copied as-is: v1 design §91
  # flags them as stale; fix them here when the Codex catalogue is confirmed.
  same_cli_downgrade:
    claude-fable-5: claude-sonnet-5
    claude-opus-5: claude-sonnet-5
    gpt-5.6-sol: gpt-5.6-luna
    gpt-5.6-terra: gpt-5.6-luna
  aliases:
    fable: claude-fable-5
    opus: claude-opus-5
    sonnet: claude-sonnet-5
    haiku: claude-haiku-5-5          # 2026-10-14: Claude Code 2.1.296 resolves the haiku alias to 5.5 (cli_tier_map d45fe764)
    claude-haiku-4-5-20251001: claude-haiku-4-5
    claude-opus-4-8: claude-opus-5
    gpt-5.5: gpt-5.6-terra
    gpt-reserve: gpt-5.6-luna
  # Model assumed when a slot names none.
  default:
    codex: gpt-5.6-terra
    claude: claude-fable-5

watchdog_prompts:
  # Watchdog prompt table (docs/design.md §24). Hot-reloaded: the daemon re-reads this file when it
  # changes; an invalid edit is refused (audited) and the previous table stays in force.
  #
  # prompts: whitelist of KNOWN, harmless confirmation dialogs. When every string in `match` (case-
  #   insensitive, literal) is on the last `tail_lines` lines of the agent's screen, the watchdog
  #   saves the screen and sends `keys` (cmux send-key names). The same dialog answered `max_hits`
  #   times within one delivery stops being answered: the slot is treated as stalled.
  #   `any` (optional) additionally needs at least one of its strings.
  #   `verify` (required): matching text is NOT an authorisation. Before any key is sent the watchdog
  #   checks that the pane is this run's own (cmux registry, not an adopted pane) and that the
  #   dialog's concrete operation / path lies inside a grant the run already has:
  #     own_cwd       every path shown is the slot's own directory (trusted at spawn)
  #     paths_in_run  every path shown is inside the slot directory or <run>/workspace (--add-dir)
  #   If the scope cannot be read off the screen, nothing is pressed: screen saved, the slot is marked
  #   prompt_wait and dispatch pauses (not a hold: once a human answers in the pane the turn settles).
  # unknown_markers: a screen that shows one of these but matches no whitelist entry is an UNKNOWN
  #   dialog: the screen is saved, the slot is marked prompt_wait, and nothing is pressed (an Enter
  #   could approve something the task never authorised).
  #   Deletions are always the user's call (2026-10-14): "dangerous rm" is an unknown marker, never a
  #   whitelist entry, and nothing in the fleet answers a delete confirmation (no PermissionRequest hook).
  # delete_markers (optional): extra words / phrases that make a dialog a delete (moves / renames count).
  #   The built-in list (cmux_fleet/watchdog.py DELETE_MARKERS: rm, unlink, delete, remove, mv, rename,
  #   git clean, DROP TABLE, 删除, 移动 ...) is always in force; this list can only add to it. Any of them
  #   in the last tail_lines rows means no key is ever pressed by the program, even on a whitelisted dialog.
  tail_lines: 25
  max_hits: 3
  prompts:
    - name: read_outside
      # "Read outside the working directories?" (E2: hub stuck 26 days on it).
      match: ["outside the working director"]
      keys: [Enter]
      verify: paths_in_run
    - name: trust_folder
      # Claude Code 2.1.280, captured live 2026-10-12 in a throwaway PTY: "Accessing workspace: <path>
      # ... Is this a project you created or one you trust?" with "❯ No, exit" PRESELECTED; Enter alone
      # would close the session. Down was verified live to move the cursor to "Yes, I trust this folder".
      match: ["yes, i trust this folder", "❯ no, exit"]
      keys: [Down, Enter]
      verify: own_cwd
    - name: trust_folder_legacy
      # Codex "Trust this folder?" / older Claude "Do you trust the files in this folder?" (default Yes).
      # Text NOT reproduced live: Codex 0.162.1 showed no trust dialog in a non-git directory.
      match: ["trust"]
      any: ["trust this folder?", "trust the files in this folder"]
      keys: [Enter]
      verify: own_cwd
  unknown_markers:
    # Claude Code asks for `rm` on a possibly-empty variable even under --dangerously-skip-permissions
    # (10/12 E16). Every delete is confirmed by the user: screen saved, slot marked, no key pressed.
    - "Dangerous rm"
    - "Do you want to proceed?"
    - "Do you want to make this edit"
    - "Do you want to create"
    - "❯ 1. Yes"
  delete_markers: []

capability_matrix:
  # 模型能力实验表（顾问的唯一软依据；advisor 设计稿 §7）。数据不是代码，每次会诊现读（热载）。
  # 结构：<领域（= context_domains.yaml 的键）>: <任务类型>: <模型卡 id>: {verdict, effort?, evidence?, note?}
  # verdict ∈ enough / enough_simple / not_enough / overkill / untested / reserve
  # untested 的格禁选，除非这一行所有已测格都是 not_enough（daemon 记 capability.gap）。
  # evidence 只引实验编号 / 规则页 / tasks/lessons.md / 复核报告 / 日记，不引 memory。
  research_web:
    web-research:
      sonnet: {verdict: enough, effort: medium, evidence: "E-03 2026-10-07 板块轮动两次对比，研究质量 ≥ 本机直派（tasks/plans/sector-fleet-*-review-fable-r2-20261013.md）；用户 10-14：联网搜索 sonnet 够用不派 opus"}
      opus: {verdict: overkill, evidence: "同上，质量无差，token 更多"}
      haiku: {verdict: untested}
    long-form-summary:
      sonnet: {verdict: enough_simple}
  fleet:
    code-edit:
      sonnet: {verdict: enough_simple, note: "单文件、路径已明"}
      opus: {verdict: enough}
      fable: {verdict: reserve, note: "只做复核 / 会诊"}
    review:
      opus: {verdict: enough, evidence: "R-WKF-033 ~28 个系列"}
      sonnet: {verdict: not_enough, evidence: "复核卡已由 sonnet 改 opus（model-cards sonnet.evidence）"}

