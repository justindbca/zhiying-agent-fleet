# cmux-fleet configuration: one file, one block per table.
#
# This file ships the defaults. The operator's private file has the same format:
#   $CMUX_FLEET_CONFIG, else ~/.cmux-fleet/fleet.yaml   (never part of this repository)
# A top-level block there replaces the shipped block as a whole (no deep merge). Only these blocks may
# be overridden there: accounts, tools, walls, lifecycle_modes. cli_pairs (the real-smoke gate),
# watchdog_prompts (the dialog whitelist), models, profiles and capability_matrix change only here,
# through a reviewed commit.
#
# Blocks
#   cli_pairs          supervisor CLI x worker CLI x mode: which pairs passed a real smoke   (cli_pairs.py)
#   lifecycle_modes    what "done" means for a run and how it is closed                       (lifecycle.py)
#   walls              usage-wall wording, same-CLI downgrade, model aliases                  (brake.py)
#   watchdog_prompts   dialogs the watchdog may answer, markers it must hold                  (watchdog.py)
#   capability_matrix  domain x task type x model card -> enough / not enough                 (advisor.py)
#   models             model cards, keyed by card id                                          (agent_registry.py)
#   profiles           agent profiles (CLI + model card + role file), keyed by profile id     (agent_registry.py)
#   accounts           account pools for budget cards (empty here; fill in the private file)  (brake.py)
#   tools              tool pools reached through thin MCP servers (empty here)
#   pi_context         context window written into each run's pi models.json            (pi_adapter.py)

cli_pairs:
  # Transport v2 supervisor_cli x worker_cli x mode table (read by cmux_fleet/cli_pairs.py).
  # Re-read on every check: an edit takes effect at the next start.
  #   status: verified   -> runs normally
  #           unverified -> runs only with --lifecycle smoke (cfg lifecycle == 'smoke')
  #           forbidden  -> refused; a pair/mode missing from this table is forbidden too
  #   adapter_missing: non-empty -> refused even for smoke
  #   reason: the refusal text shown to the user (unverified / forbidden / adapter_missing rows)
  #   verified_by: the real smoke (scripts/smoke_pair.sh, 1 supervisor + 2 workers, 4 v2 checks) that flipped it
  # Exception kept in code: claude+claude task or service with cfg adopt (docs/design.md §19 sub-fleet, §29 named).
  # CLI boundary (docs/design.md §6, §11 2026-10-13 "Codex/FlashNext via pi"): Claude agents run only the
  # official `claude` CLI; pi never uses Claude subscription credentials. Codex models (openai-codex/*, ChatGPT
  # login) and FlashNext run through pi. The official Codex TUI supervisor stays optional:
  # `start --supervisor-cli codex [--supervisor-profile X]` (codex+* rows below).
  # default keys: supervisor_cli, worker_cli, mode, supervisor_profile (Codex supervisor only),
  #   supervisor_pi_model / supervisor_pi_thinking (a defaulted pi supervisor only; used only when neither
  #   --supervisor-pi-model/-thinking nor an explicit --pi-model/--pi-thinking is given -- a typed flag always wins).
  #   Any other default key is a load error.
  # Night pair (no extra schema): pi+pi rows with per-agent models, e.g.
  #   start --supervisor-cli pi --worker-cli pi --supervisor-pi-model openai-codex/gpt-6-astra
  #     --supervisor-pi-thinking high --pi-model flashnext/Qwen3.8-Flash-Next-Uncensored-oQ4e-100K-MTP --lifecycle <mode>
  #   (or roster rows `pi_model:` per worker). An explicit --supervisor-cli pi does not read default.supervisor_pi_*;
  #   --supervisor-pi-model is required there, else --pi-model would put the supervisor on FlashNext too.
  version: 1
  # start fills unset --supervisor-cli/--worker-cli (and, for a pi supervisor, its pi model/thinking) from here.
  # User decision 2026-10-13: pi supervisor on openai-codex/gpt-6-astra (thinking high) + official Claude Code workers.
  default: {supervisor_cli: pi, worker_cli: claude, mode: task,
            supervisor_pi_model: openai-codex/gpt-6-astra, supervisor_pi_thinking: high}
  pairs:
    - {supervisor_cli: pi, worker_cli: pi, mode: task, status: verified, adapter_missing: [],
       verified_by: "design.md §11 §14", notes: "all-Pi bridge"}
    - {supervisor_cli: pi, worker_cli: pi, mode: service, status: verified, adapter_missing: [],
       verified_by: "design.md §11 §14", notes: "all-Pi bridge; night pair = pi Astra supervisor + pi FlashNext workers via per-agent models"}
    - {supervisor_cli: pi, worker_cli: claude, mode: task, status: verified, adapter_missing: [],
       verified_by: "real smoke scripts/smoke_pair.sh pi claude task: fleet-20261013-115145-828661b9 2026-10-13 @3421f0d8+feat/codex-via-pi worktree, 4/4 checks PASS",
       reason: "transport v2 pi supervisor + official Claude Code workers: verified by a real smoke (scripts/smoke_pair.sh pi claude task, see verified_by); shown only if this row is set back to unverified",
       notes: "default (user decision 2026-10-13): pi Astra/high supervisor + official Claude Code workers"}
    - {supervisor_cli: pi, worker_cli: claude, mode: service, status: verified, adapter_missing: [],
       verified_by: "real smoke scripts/smoke_pair.sh pi claude service: fleet-20261013-115347-7e61f9af 2026-10-13 @3421f0d8+feat/codex-via-pi worktree, 4/4 checks PASS",
       reason: "transport v2 pi supervisor + official Claude Code workers: verified by a real smoke (scripts/smoke_pair.sh pi claude service, see verified_by); shown only if this row is set back to unverified"}
    - {supervisor_cli: codex, worker_cli: claude, mode: task, status: verified, adapter_missing: [],
       verified_by: "user decision 2026-10-12; design.md §18", notes: "optional official Codex TUI supervisor + official Claude Code workers (default until 2026-10-13)"}
    - {supervisor_cli: codex, worker_cli: claude, mode: service, status: verified,
       adapter_missing: [], verified_by: "real smoke scripts/smoke_pair.sh codex claude service: fleet-20261012-155328-b5e88a63 2026-10-12 @8a31c3c7, 4/4 checks PASS",
       reason: "transport v2 Codex supervisor + Claude workers supports task mode only until service mode passes a real smoke (scripts/smoke_pair.sh codex claude service); result cards render off-model via tui_cards",
       notes: "MAYFLY auto_apply (Claude experts); cards -> <run>/cards/<slot>.log + history page Cards view"}
    - {supervisor_cli: codex, worker_cli: pi, mode: task, status: verified, adapter_missing: [], verified_by: "real smoke scripts/smoke_pair.sh codex pi task: fleet-20261012-153556-1888b011 2026-10-12 @8a31c3c7, 4/4 checks PASS",
       reason: "transport v2 mixed Pi/Codex fleets are unvalidated (supported: all-Pi, or Codex supervisor + Claude workers)",
       notes: "night pair (Codex supervisor + pi FlashNext workers); daemon wiring tested in tests/test_v2_codex_pi.py"}
    - {supervisor_cli: codex, worker_cli: pi, mode: service, status: verified, adapter_missing: [], verified_by: "real smoke scripts/smoke_pair.sh codex pi service: fleet-20261012-155132-be46943c 2026-10-12 @8a31c3c7, 4/4 checks PASS",
       reason: "transport v2 mixed Pi/Codex fleets are unvalidated (supported: all-Pi, or Codex supervisor + Claude workers)"}
    - {supervisor_cli: claude, worker_cli: pi, mode: task, status: verified,
       adapter_missing: [], verified_by: "real smoke scripts/smoke_pair.sh claude pi task: fleet-20261012-155507-b74b7b86 2026-10-12 @8a31c3c7, 4/4 checks PASS + scripts/smoke_claude_input.sh fleet-20261012-160527-a590623c",
       reason: "transport v2 Claude supervisor pairs are unverified (adapter: Stop-hook decision JSON, READY gate, UserPromptSubmit operator queue; live smoke pending)"}
    - {supervisor_cli: claude, worker_cli: pi, mode: service, status: verified,
       adapter_missing: [], verified_by: "real smoke scripts/smoke_pair.sh claude pi service: fleet-20261012-155802-2f8d1fac 2026-10-12 @8a31c3c7, 4/4 checks PASS",
       reason: "transport v2 Claude supervisor pairs are unverified (adapter: Stop-hook decision JSON, READY gate, UserPromptSubmit operator queue; live smoke pending)"}
    - {supervisor_cli: claude, worker_cli: claude, mode: task, status: verified,
       adapter_missing: [], verified_by: "real smoke scripts/smoke_pair.sh claude claude task: fleet-20261012-161127-cf26826f 2026-10-12 @8a31c3c7, 4/4 checks PASS",
