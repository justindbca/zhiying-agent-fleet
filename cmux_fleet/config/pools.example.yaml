# Example pools file. Copy to ~/.cmux-fleet/pools.yaml (or point $CMUX_FLEET_POOLS at it) and fill in
# your own accounts. The real file is private: it is never part of this repository.
#
# A budget card's "pool" names an account by id or alias. meter decides which budget line applies:
#   usd_equiv : max_usd      (equivalent USD spent since the card started; caps.day_usd / night_usd
#                             is the default cap when the card has no max_usd, else 40 / 10)
#   week_pct  : max_week_pct (the account's weekly quota %, absolute)
#   calls / none : no pool line (max_calls / max_rounds / max_hours still apply)
# Readings come from quota.json (rows keyed by account id); missing or stale = unknown, never trips.
accounts:
  - id: pool-a
    provider: claude          # model cards' quota_pool family
    aliases: []               # older names a budget card may still use
    meter: usd_equiv
    hosts: [host-1, host-2]   # informational for now
    caps: {day_usd: 40, night_usd: 10}
  - id: pool-b
    provider: claude
    meter: week_pct
    hosts: [host-3]
  - id: codex-a
    provider: codex
    meter: week_pct
  - id: local-gpu
    provider: free-studio
    meter: none
