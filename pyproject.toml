[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cmux-fleet"
version = "0.1.0"
description = "Supervisor + N worker Codex agents in cmux tabs, coordinated by a daemon over a private Redis socket, with automatic context handoff."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["redis>=4.0", "PyYAML>=5.1"]
classifiers = [
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cmux-fleet = "cmux_fleet.fleet:main"

[tool.setuptools]
packages = ["cmux_fleet"]

[tool.setuptools.package-data]
cmux_fleet = ["agents/*.md", "agents/*.json", "config/*.yaml", "pi_extension*.ts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
